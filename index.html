
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>🔥 GAS PARTY SIMULATOR 🔥</title>
  <style>
    :root {
      --bg-color: #050508;
      --card-bg: #12131c;
      --neon-pink: #ff007f;
      --neon-blue: #00f0ff;
      --neon-yellow: #ffee00;
      --text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      display: grid;
      grid-template-columns: 440px 320px;
      gap: 20px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: 20px;
      border: 2px solid #222338;
      box-shadow: 0 0 30px rgba(0, 240, 255, 0.15);
    }

    .stage {
      display: flex;
      flex-direction: column;
      gap: 15px;
      position: relative;
    }

    .canvas-wrapper {
      position: relative;
      border: 3px solid var(--neon-blue);
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      box-shadow: inset 0 0 20px rgba(0,240,255,0.2);
    }

    /* 화면 흔들림 효과 */
    .shake {
      animation: shake 0.1s infinite;
    }
    @keyframes shake {
      0% { transform: translate(2px, 2px); }
      50% { transform: translate(-2px, -2px); }
      100% { transform: translate(2px, -2px); }
    }

    canvas { display: block; }

    .control-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    h1 {
      font-size: 1.4rem;
      color: var(--neon-pink);
      text-shadow: 0 0 8px var(--neon-pink);
      text-align: center;
    }

    .control-card {
      background: #1a1b2b;
      padding: 12px 16px;
      border-radius: 10px;
      border-left: 4px solid var(--neon-blue);
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 0.9rem;
      margin-bottom: 6px;
    }

    input[type=range] {
      width: 100%;
      accent-color: var(--neon-pink);
      cursor: pointer;
    }

    .status-box {
      background: #080911;
      border: 1px dashed var(--neon-yellow);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
    }

    .status-title { font-size: 0.8rem; color: #888; }
    .status-val { font-size: 1.8rem; font-weight: 900; color: var(--neon-yellow); }
    .warning { color: #ff3333; font-weight: bold; display: none; }

    /* P-V 그래프 카드 */
    .graph-card {
      border: 1px solid #333;
      border-radius: 8px;
      background: #05050a;
      padding: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="stage">
    <h1>🕺 GAS PARTY 💃</h1>
    <div class="canvas-wrapper" id="shakeTarget">
      <canvas id="simCanvas" width="440" height="320"></canvas>
    </div>
    <div class="graph-card">
      <canvas id="graphCanvas" width="430" height="110"></canvas>
    </div>
  </div>

  <div class="control-panel">
    <div class="control-card">
      <div class="label-row">
        <span>🔥 파티 열기 (T)</span>
        <span style="color:var(--neon-pink)"><span id="tempVal">300</span> K</span>
      </div>
      <input type="range" id="temp" min="100" max="800" value="300">
    </div>

    <div class="control-card">
      <div class="label-row">
        <span>🎉 인원수 (n)</span>
        <span style="color:var(--neon-blue)"><span id="nVal">30</span> 명</span>
      </div>
      <input type="range" id="particles" min="10" max="80" value="30">
    </div>

    <div class="control-card">
      <div class="label-row">
        <span>🏋️ 스테이지 압박 (P)</span>
        <span style="color:var(--neon-yellow)"><span id="pVal">1.0</span> atm</span>
      </div>
      <input type="range" id="pressure" min="0.5" max="4.0" step="0.1" value="1.0">
    </div>

    <div class="status-box">
      <div class="status-title">스테이지 크기 (Volume, V)</div>
      <div class="status-val"><span id="vVal">0</span> L</div>
      <div class="warning" id="warnText">⚠️ 압력 과부하! 폭발 직전!</div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('simCanvas');
  const ctx = canvas.getContext('2d');
  const gCanvas = document.getElementById('graphCanvas');
  const gCtx = gCanvas.getContext('2d');
  const shakeTarget = document.getElementById('shakeTarget');

  const tempInput = document.getElementById('temp');
  const nInput = document.getElementById('particles');
  const pInput = document.getElementById('pressure');

  const R = 0.0821;
  let particles = [];
  let pvHistory = [];

  // 표정 모음 (기체 흥분 상태별)
  const EMOJIS = {
    chill: ['😴', '😌', '🧊'],
    party: ['😃', '🥳', '💃', '🕺'],
    crazy: ['😱', '🔥', '🤪', '💥']
  };

  function initParticles(num) {
    particles = [];
    for (let i = 0; i < num; i++) {
      particles.push({
        x: Math.random() * (canvas.width - 40) + 20,
        y: Math.random() * (canvas.height - 40) + 20,
        vx: (Math.random() - 0.5) * 3,
        vy: (Math.random() - 0.5) * 3,
        face: '🥳'
      });
    }
  }

  // 실시간 P-V 그래프 그리기
  function drawGraph() {
    gCtx.clearRect(0, 0, gCanvas.width, gCanvas.height);

    // 축 그리드
    gCtx.strokeStyle = '#222';
    gCtx.lineWidth = 1;
    gCtx.beginPath();
    gCtx.moveTo(25, 10); gCtx.lineTo(25, 90); gCtx.lineTo(410, 90);
    gCtx.stroke();

    gCtx.fillStyle = '#666';
    gCtx.font = '10px monospace';
    gCtx.fillText('P', 10, 15);
    gCtx.fillText('V', 415, 100);

    if (pvHistory.length < 2) return;

    // 그래프 선 그리기
    gCtx.strokeStyle = '#00f0ff';
    gCtx.lineWidth = 2;
    gCtx.beginPath();

    pvHistory.forEach((pt, i) => {
      // V(0~200) -> X(25~410), P(0~5) -> Y(90~10)
      const gx = 25 + Math.min((pt.v / 200) * 385, 385);
      const gy = 90 - Math.min((pt.p / 5) * 80, 80);

      if (i === 0) gCtx.moveTo(gx, gy);
      else gCtx.lineTo(gx, gy);
    });
    gCtx.stroke();

    // 현재 상태 점으로 찍기
    const last = pvHistory[pvHistory.length - 1];
    const curX = 25 + Math.min((last.v / 200) * 385, 385);
    const curY = 90 - Math.min((last.p / 5) * 80, 80);

    gCtx.fillStyle = '#ff007f';
    gCtx.beginPath();
    gCtx.arc(curX, curY, 4, 0, Math.PI * 2);
    gCtx.fill();
  }

  function update() {
    const T = parseFloat(tempInput.value);
    const n = parseInt(nInput.value);
    const P = parseFloat(pInput.value);

    document.getElementById('tempVal').textContent = T;
    document.getElementById('nVal').textContent = n;
    document.getElementById('pVal').textContent = P.toFixed(1);

    // V = nRT / P 계산
    const V = (n * R * T) / P;
    document.getElementById('vVal').textContent = V.toFixed(1);

    // 기록 저장
    pvHistory.push({ p: P, v: V });
    if (pvHistory.length > 80) pvHistory.shift();

    // 부피를 피스톤 높이로 반영
    const containerHeight = Math.min(Math.max(V * 1.5, 60), canvas.height - 20);
    const topWall = canvas.height - containerHeight;

    // 압력 경고 및 흔들림 효과
    if (P >= 3.0 && V < 60) {
      shakeTarget.classList.add('shake');
      document.getElementById('warnText').style.display = 'block';
    } else {
      shakeTarget.classList.remove('shake');
      document.getElementById('warnText').style.display = 'none';
    }

    if (particles.length !== n) initParticles(n);

    // 온도가 올라가면 속도가 빨라짐
    const speed = Math.sqrt(T / 300) * 3;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 미러볼 효과 (상단 벽)
    ctx.fillStyle = '#11121e';
    ctx.fillRect(0, 0, canvas.width, topWall);
    
    // 피스톤 (움직이는 천장)
    ctx.fillStyle = '#ff007f';
    ctx.fillRect(0, topWall - 10, canvas.width, 10);

    // 입자 그리기 (이모지 댄서들)
    ctx.font = '18px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    particles.forEach(p => {
      p.x += p.vx * speed;
      p.y += p.vy * speed;

      // 좌우 벽 충돌
      if (p.x <= 15 || p.x >= canvas.width - 15) p.vx *= -1;
      // 천장(피스톤) 및 바닥 충돌
      if (p.y <= topWall + 15) { p.y = topWall + 15; p.vy *= -1; }
      if (p.y >= canvas.height - 15) { p.y = canvas.height - 15; p.vy *= -1; }

      // 온동 조건에 맞춘 표정 변화
      let emojiList = EMOJIS.party;
      if (T < 200) emojiList = EMOJIS.chill;
      else if (T > 500) emojiList = EMOJIS.crazy;

      const currentEmoji = emojiList[Math.floor((p.x + p.y) % emojiList.length)];
      ctx.fillText(currentEmoji, p.x, p.y);
    });

    drawGraph();
    requestAnimationFrame(update);
  }

  initParticles(30);
  update();
</script>

</body>
</html>
